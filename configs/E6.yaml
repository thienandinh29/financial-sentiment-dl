# E6 — DistilBERT fine-tuning + LLM P2 soft-label knowledge distillation on 2026 train_unlabeled pool (RQ3).
# Single change from configs/E12.yaml (AGENTS.md rule 4 & docs/guides/TV3-tuan4.md task 3.14):
# replaces hard argmax pseudo-labels with temperature-scaled soft targets softmax(letter_logp / T)
# and distillation loss alpha * T^2 * KL(target_T || softmax(logits / T)) on pseudo-labeled rows.
# Class weights for weighted_ce on FNS rows are computed ONLY on FNS train (identical to E5/E12).
# Grid search on validation (seed 1): T in {1, 2, 4} x alpha in {0.3, 0.5, 0.7} -> results/E6/grid.md.
experiment: E6
rq: RQ3

data:
  dataset: zeroshot/twitter-financial-news-sentiment
  split_file: data/splits/cluster_split.jsonl   # frozen split (PR #10), checked by SHA-256
  split_sha256: 8c2c35ea789acf5b2bd9c74c5e59fa0df325034422be42ae7b47f2e8c9c46aaa
  max_len: 64
  pseudo_labels: results/llm_soft_labels/p2_soft_labels.jsonl
  pseudo_mode: soft                             # E6: soft targets softmax(letter_logp / T)
  distill_alpha: 0.7                            # selected on validation grid (seed 1) from {0.3, 0.5, 0.7}
  distill_temperature: 2.0                      # selected on validation grid (seed 1) from {1.0, 2.0, 4.0}

model:
  name: transformer
  pretrained_name: distilbert/distilbert-base-uncased
  num_labels: 3
  dropout: 0.3
  freeze_encoder: false

train:
  loss: weighted_ce
  optimizer: adamw
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  batch_size: 32
  max_epochs: 4
  grad_clip: 1.0
  early_stopping:
    metric: val_macro_f1
    patience: 3
  mixed_precision: true

seeds: [1, 2, 3]
