# E7 — DistilBERT with frozen encoder, training only the classification head (RQ3).
# Copied from configs/E5.yaml; the single changed experimental factor is freeze_encoder: true.
experiment: E7
rq: RQ3

data:
  dataset: zeroshot/twitter-financial-news-sentiment
  split_file: data/splits/cluster_split.jsonl   # frozen split (PR #10), checked by SHA-256
  split_sha256: 8c2c35ea789acf5b2bd9c74c5e59fa0df325034422be42ae7b47f2e8c9c46aaa
  max_len: 64

model:
  name: transformer
  pretrained_name: distilbert/distilbert-base-uncased
  num_labels: 3
  dropout: 0.3
  freeze_encoder: true             # E5: false

train:
  loss: weighted_ce
  optimizer: adamw
  lr: 2.0e-5
  weight_decay: 0.01
  warmup_ratio: 0.1
  batch_size: 32
  max_epochs: 4
  grad_clip: 1.0
  early_stopping:
    metric: val_macro_f1
    patience: 3
  mixed_precision: true

seeds: [1, 2, 3]
